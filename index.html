<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorPit 🎨</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --text: #f1f5f9;
    --accent: #38bdf8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    background: radial-gradient(circle at top, #1e293b, #0f172a 70%);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, sans-serif;
    padding: 20px;
  }
  h1 {
    margin: 0;
    font-size: 1.5rem;
    letter-spacing: 1px;
  }
  .panel {
    background: var(--panel);
    border-radius: 12px;
    padding: 8px 14px;
    box-shadow: 0 6px 20px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: 14px;
    width: 100%;
    max-width: 480px;
    justify-content: center;
  }
  .panel h2 {
    margin: 0;
    font-size: 0.75rem;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 1px;
    white-space: nowrap;
  }
  .option-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .option-row label {
    font-size: 0.8rem;
    opacity: 0.85;
  }
  input[type="color"] {
    width: 30px;
    height: 24px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: none;
    padding: 0;
  }
  .swatches {
    display: flex;
    gap: 4px;
  }
  .swatch {
    width: 15px;
    height: 15px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.4);
    cursor: pointer;
  }
  .swatch:hover { border-color: white; }
  .swatch.selected {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(56,189,248,0.4);
  }
  #bgSwatches .swatch {
    width: 20px;
    height: 20px;
  }
  canvas {
    background: #020617;
    border-radius: 16px;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
    touch-action: none;
    max-width: 90vw;
    height: auto;
  }
  .stats {
    display: flex;
    gap: 20px;
    font-size: 1rem;
    margin-top: 4px;
  }
  .stats span { color: var(--accent); font-weight: bold; }
  button {
    padding: 7px 12px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #0f172a;
    font-weight: bold;
    cursor: pointer;
    font-size: 0.8rem;
    white-space: nowrap;
    transition: transform 0.1s ease;
  }
  button:hover { transform: scale(1.03); }
  .hint {
    width: 100%;
    font-size: 0.72rem;
    opacity: 0.6;
    margin: 0;
    line-height: 1.3;
  }
  .overlay {
    position: absolute;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(2,6,23,0.75);
    border-radius: 16px;
    text-align: center;
    flex-direction: column;
    gap: 10px;
  }
  .overlay.show { display: flex; }
  .canvas-wrap { position: relative; }

  #usernameInput {
    width: 100%;
    max-width: 220px;
    padding: 8px 10px;
    border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.2);
    background: #0f172a;
    color: var(--text);
    font-size: 0.9rem;
    text-align: center;
  }
  .modal-overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    background: rgba(2,6,23,0.8);
    z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--panel);
    border-radius: 14px;
    padding: 20px;
    width: 90%;
    max-width: 320px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 14px 40px rgba(0,0,0,0.5);
  }
  .modal-box h2 {
    margin: 0 0 12px;
    font-size: 1.1rem;
    color: var(--accent);
    text-align: center;
  }
  #rankingList {
    list-style: none;
    margin: 0 0 14px;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 0.85rem;
  }
  #rankingList li {
    display: flex;
    justify-content: space-between;
    background: rgba(255,255,255,0.05);
    padding: 6px 10px;
    border-radius: 6px;
  }
  #rankingList li span.rank { color: var(--accent); font-weight: bold; margin-right: 6px; }
</style>
</head>
<body>
  <h1>🎨 ColorPit</h1>

  <div class="panel">
    <h2>Personaliza</h2>
    <div class="option-row">
      <label for="snakeColor">Serpiente</label>
      <input type="color" id="snakeColor" value="#22c55e">
      <div class="swatches" id="snakeSwatches"></div>
    </div>
    <div class="option-row">
      <label>Fondo</label>
      <input type="color" id="bgColor" value="#000000" style="display:none">
      <div class="swatches" id="bgSwatches"></div>
    </div>
    <button id="restartBtn">🔄 Reiniciar</button>
    <button id="musicBtn">🔇 Música</button>
    <button id="rankingBtn">🏆 Ranking</button>
    <p class="hint">Usa las flechas o WASD para moverte (swipe en móvil). La fruta va rotando sola: naranja, manzana, banano, fresa y limón.</p>
  </div>

  <audio id="bgMusic" src="Snake.io Music.mp3" loop preload="auto"></audio>

  <div class="canvas-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <div class="overlay show" id="startOverlay">
      <div style="font-size:1.4rem;font-weight:bold">🎨 Elige tus colores</div>
      <div style="font-size:0.85rem;opacity:0.8;max-width:280px">Ajusta la serpiente y el fondo arriba, escribe tu apodo y ¡a jugar!</div>
      <input type="text" id="usernameInput" placeholder="Tu apodo" maxlength="20">
      <button id="startBtn" style="width:auto;padding:10px 24px">▶ Jugar</button>
    </div>
    <div class="overlay" id="overlay">
      <div style="font-size:1.4rem;font-weight:bold">💀 Game Over</div>
      <div id="finalScore"></div>
      <div id="saveStatus" style="font-size:0.75rem;opacity:0.7"></div>
      <button id="overlayRestart" style="width:auto;padding:10px 24px">Jugar de nuevo</button>
    </div>
  </div>

  <div class="modal-overlay" id="rankingModal">
    <div class="modal-box">
      <h2>🏆 Ranking</h2>
      <ol id="rankingList"><li>Cargando...</li></ol>
      <button id="closeRanking" style="width:100%">Cerrar</button>
    </div>
  </div>

  <div class="stats">
    <div>Puntos: <span id="score">0</span></div>
    <div>Mejor: <span id="best">0</span></div>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const gridSize = 20;
  const tileCount = canvas.width / gridSize;

  const snakeColorInput = document.getElementById('snakeColor');
  const bgColorInput = document.getElementById('bgColor');
  const restartBtn = document.getElementById('restartBtn');
  const overlayRestart = document.getElementById('overlayRestart');
  const overlay = document.getElementById('overlay');
  const startOverlay = document.getElementById('startOverlay');
  const startBtn = document.getElementById('startBtn');
  const musicBtn = document.getElementById('musicBtn');
  const scoreEl = document.getElementById('score');
  const bestEl = document.getElementById('best');
  const finalScoreEl = document.getElementById('finalScore');
  const usernameInput = document.getElementById('usernameInput');
  const saveStatusEl = document.getElementById('saveStatus');
  const rankingBtn = document.getElementById('rankingBtn');
  const rankingModal = document.getElementById('rankingModal');
  const rankingList = document.getElementById('rankingList');
  const closeRankingBtn = document.getElementById('closeRanking');

  // --- Conexión a Supabase (puntajes y ranking) ---
  // Reemplaza estos dos valores con los de tu proyecto: Supabase > Project Settings > API
  const SUPABASE_URL = 'https://evuapltfafzmpgumlsez.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_jzXkNa2_ygeafon-upVHDQ_z6g8AxJ7';

  let supabaseClient = null;
  if (window.supabase && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.startsWith('PEGA_AQUI')) {
    supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }

  usernameInput.value = localStorage.getItem('snakeUsername') || '';

  async function saveScoreToRanking(username, finalScore, snakeColor) {
    if (!supabaseClient || !username || finalScore <= 0) return;
    try {
      const { error } = await supabaseClient.from('scores').insert({
        username,
        score: finalScore,
        snake_color: snakeColor,
        snake_color_name: getColorName(snakeColor)
      });
      saveStatusEl.textContent = error ? 'No se pudo guardar el puntaje.' : '✅ Puntaje guardado en el ranking';
    } catch (e) {
      saveStatusEl.textContent = 'No se pudo guardar el puntaje.';
    }
  }

  const HEX_COLOR_RE = /^#[0-9a-fA-F]{6}$/;

  async function loadRanking() {
    rankingList.innerHTML = '<li>Cargando...</li>';
    if (!supabaseClient) {
      rankingList.innerHTML = '<li>Ranking no configurado todavía.</li>';
      return;
    }
    const { data, error } = await supabaseClient
      .from('scores')
      .select('username, score, snake_color')
      .order('score', { ascending: false })
      .limit(10);
    if (error) {
      rankingList.innerHTML = '<li>Error cargando el ranking.</li>';
      return;
    }
    if (!data || data.length === 0) {
      rankingList.innerHTML = '<li>Todavía no hay puntajes. ¡Sé el primero!</li>';
      return;
    }
    rankingList.innerHTML = '';
    data.forEach((row, i) => {
      const li = document.createElement('li');

      const left = document.createElement('span');
      const rank = document.createElement('span');
      rank.className = 'rank';
      rank.textContent = `#${i + 1}`;
      const dot = document.createElement('span');
      dot.style.cssText = 'display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle;';
      if (row.snake_color === 'rainbow') {
        dot.style.background = 'conic-gradient(red, orange, yellow, green, blue, violet, red)';
        dot.title = 'Modo arcoíris';
      } else {
        dot.style.background = HEX_COLOR_RE.test(row.snake_color) ? row.snake_color : '#38bdf8';
      }
      left.appendChild(rank);
      left.appendChild(dot);
      left.appendChild(document.createTextNode(row.username));

      const right = document.createElement('span');
      right.textContent = row.score;

      li.appendChild(left);
      li.appendChild(right);
      rankingList.appendChild(li);
    });
  }

  rankingBtn.addEventListener('click', () => {
    rankingModal.classList.add('show');
    loadRanking();
  });
  closeRankingBtn.addEventListener('click', () => {
    rankingModal.classList.remove('show');
  });

  const snakePalette = ['#22c55e', '#38bdf8', '#f43f5e', '#facc15', '#a855f7', '#ffffff'];
  const bgPalette = ['#ffffff', '#000000', '#808080'];

  // Nombre legible del color, para mostrar en el ranking / al exportar los datos
  const SNAKE_COLOR_NAMES = [
    { hex: '#22c55e', name: 'Verde' },
    { hex: '#38bdf8', name: 'Celeste' },
    { hex: '#f43f5e', name: 'Rojo' },
    { hex: '#facc15', name: 'Amarillo' },
    { hex: '#a855f7', name: 'Morado' },
    { hex: '#ffffff', name: 'Blanco' }
  ];

  function hexToRgb(hex) {
    const num = parseInt(hex.replace('#', ''), 16);
    return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
  }

  function getColorName(value) {
    if (value === 'rainbow') return 'Arcoíris';
    if (!HEX_COLOR_RE.test(value)) return 'Desconocido';
    const target = hexToRgb(value);
    let best = SNAKE_COLOR_NAMES[0];
    let bestDist = Infinity;
    SNAKE_COLOR_NAMES.forEach(c => {
      const rgb = hexToRgb(c.hex);
      const dist = (rgb.r - target.r) ** 2 + (rgb.g - target.g) ** 2 + (rgb.b - target.b) ** 2;
      if (dist < bestDist) {
        bestDist = dist;
        best = c;
      }
    });
    return best.name;
  }

  // La comida rota automáticamente entre estas frutas; el jugador no la elige
  const FOOD_FRUITS = [
    { hex: '#f97316', emoji: '🍊' }, // naranja
    { hex: '#ef4444', emoji: '🍎' }, // manzana
    { hex: '#eab308', emoji: '🍌' }, // banano
    { hex: '#ec4899', emoji: '🍓' }, // fresa
    { hex: '#84cc16', emoji: '🍋' }  // limón
  ];
  let foodIndex = 0;
  function nextFruit() {
    const fruit = FOOD_FRUITS[foodIndex % FOOD_FRUITS.length];
    foodIndex++;
    return fruit;
  }

  function buildSwatches(container, colors, input, selectable) {
    colors.forEach(c => {
      const el = document.createElement('div');
      el.className = 'swatch';
      el.style.background = c;
      el.title = c;
      if (selectable && input.value.toLowerCase() === c.toLowerCase()) {
        el.classList.add('selected');
      }
      el.addEventListener('click', () => {
        input.value = c;
        input.dispatchEvent(new Event('input'));
        if (selectable) {
          container.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
          el.classList.add('selected');
        }
      });
      container.appendChild(el);
    });
  }
  let rainbowMode = false;

  const snakeSwatchesContainer = document.getElementById('snakeSwatches');
  function selectSnakeSwatch(el) {
    snakeSwatchesContainer.querySelectorAll('.swatch').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
  }
  snakePalette.forEach(c => {
    const el = document.createElement('div');
    el.className = 'swatch';
    el.style.background = c;
    el.title = c;
    if (c.toLowerCase() === snakeColorInput.value.toLowerCase()) el.classList.add('selected');
    el.addEventListener('click', () => {
      snakeColorInput.value = c;
      rainbowMode = false;
      selectSnakeSwatch(el);
    });
    snakeSwatchesContainer.appendChild(el);
  });
  const rainbowSwatch = document.createElement('div');
  rainbowSwatch.className = 'swatch';
  rainbowSwatch.style.background = 'conic-gradient(red, orange, yellow, green, blue, violet, red)';
  rainbowSwatch.title = 'Arcoíris';
  rainbowSwatch.addEventListener('click', () => {
    rainbowMode = true;
    selectSnakeSwatch(rainbowSwatch);
  });
  snakeSwatchesContainer.appendChild(rainbowSwatch);

  buildSwatches(document.getElementById('bgSwatches'), bgPalette, bgColorInput, true);

  const BASE_SPEED = 180;   // ms por movimiento al empezar (más alto = más lento)
  const MIN_SPEED = 60;     // velocidad máxima (ms mínimos entre movimientos)
  const SPEED_STEP = 15;    // cuánto se acelera cada 10 puntos
  const POINTS_PER_LEVEL = 10;

  let snake, velocity, nextVelocity, food, score, best, gameOver, speedMs, loopHandle, started;

  function speedForScore(s) {
    const level = Math.floor(s / POINTS_PER_LEVEL);
    return Math.max(MIN_SPEED, BASE_SPEED - level * SPEED_STEP);
  }

  best = Number(localStorage.getItem('snakeBest') || 0);
  bestEl.textContent = best;

  // --- Música de fondo (archivo local) ---
  const bgMusic = document.getElementById('bgMusic');
  let musicOn = false;

  function toggleMusic() {
    musicOn = !musicOn;
    musicBtn.textContent = musicOn ? '🔊 Música' : '🔇 Música';
    if (musicOn) {
      bgMusic.play().catch(() => {});
    } else {
      bgMusic.pause();
    }
  }
  musicBtn.addEventListener('click', toggleMusic);

  function randomFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    const fruit = nextFruit();
    return { x: pos.x, y: pos.y, hex: fruit.hex, emoji: fruit.emoji };
  }

  function resetGame() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    velocity = { x: 1, y: 0 };
    nextVelocity = { x: 1, y: 0 };
    foodIndex = 0;
    food = randomFood();
    score = 0;
    gameOver = false;
    speedMs = BASE_SPEED;
    scoreEl.textContent = score;
    overlay.classList.remove('show');
    if (loopHandle) clearTimeout(loopHandle);
    started = false;
    startOverlay.classList.add('show');
  }

  let playerName = 'Jugador';

  function startGame() {
    playerName = usernameInput.value.trim() || 'Jugador';
    localStorage.setItem('snakeUsername', playerName);
    saveStatusEl.textContent = '';
    started = true;
    startOverlay.classList.remove('show');
    if (loopHandle) clearTimeout(loopHandle);
    loop();
  }

  function hue(i) {
    return `hsl(${(Date.now() / 10 + i * 18) % 360}, 90%, 60%)`;
  }

  let particles = [];

  function spawnSparkles(cellX, cellY, color) {
    const cx = cellX * gridSize + gridSize / 2;
    const cy = cellY * gridSize + gridSize / 2;
    const count = 18;
    for (let i = 0; i < count; i++) {
      const angle = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const speed = 1.2 + Math.random() * 3;
      particles.push({
        x: cx,
        y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        decay: 0.025 + Math.random() * 0.02,
        size: 1.5 + Math.random() * 2.5,
        color: Math.random() < 0.5 ? color : '#ffffff'
      });
    }
  }

  function updateParticles() {
    if (particles.length === 0) return;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life -= p.decay;
    });
    particles = particles.filter(p => p.life > 0);
  }

  function drawParticles() {
    particles.forEach(p => {
      ctx.save();
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    });
  }

  function draw() {
    ctx.fillStyle = bgColorInput.value;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // subtle grid
    ctx.strokeStyle = 'rgba(255,255,255,0.03)';
    for (let i = 0; i <= tileCount; i++) {
      ctx.beginPath();
      ctx.moveTo(i * gridSize, 0);
      ctx.lineTo(i * gridSize, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * gridSize);
      ctx.lineTo(canvas.width, i * gridSize);
      ctx.stroke();
    }

    // food (la fruta rota sola, el jugador no la elige)
    ctx.font = `${gridSize + 6}px "Segoe UI Emoji", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(
      food.emoji,
      food.x * gridSize + gridSize / 2,
      food.y * gridSize + gridSize / 2 + 1
    );

    // snake: cuerpo de círculos superpuestos, cabeza con ojos y lengua
    for (let i = snake.length - 1; i >= 0; i--) {
      const segment = snake[i];
      const isHead = i === 0;
      const cx = segment.x * gridSize + gridSize / 2;
      const cy = segment.y * gridSize + gridSize / 2;
      const t = i / Math.max(snake.length - 1, 1);
      const radius = isHead ? gridSize / 2 : (gridSize / 2 - 1) * (1 - t * 0.3);

      ctx.fillStyle = rainbowMode ? hue(i) : (isHead ? shade(snakeColorInput.value, 20) : snakeColorInput.value);
      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0, Math.PI * 2);
      ctx.fill();

      if (isHead) {
        const angle = Math.atan2(velocity.y, velocity.x);
        const perp = angle + Math.PI / 2;

        // lengua bífida
        const tongueBase = { x: cx + Math.cos(angle) * radius * 0.9, y: cy + Math.sin(angle) * radius * 0.9 };
        const tongueTip = { x: cx + Math.cos(angle) * radius * 1.7, y: cy + Math.sin(angle) * radius * 1.7 };
        ctx.strokeStyle = '#dc2626';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(tongueBase.x, tongueBase.y);
        ctx.lineTo(tongueTip.x, tongueTip.y);
        const forkLen = gridSize * 0.14;
        ctx.moveTo(tongueTip.x, tongueTip.y);
        ctx.lineTo(tongueTip.x + Math.cos(angle + 0.5) * forkLen, tongueTip.y + Math.sin(angle + 0.5) * forkLen);
        ctx.moveTo(tongueTip.x, tongueTip.y);
        ctx.lineTo(tongueTip.x + Math.cos(angle - 0.5) * forkLen, tongueTip.y + Math.sin(angle - 0.5) * forkLen);
        ctx.stroke();

        // ojos
        [-1, 1].forEach(side => {
          const ex = cx + Math.cos(angle) * radius * 0.35 + Math.cos(perp) * radius * 0.5 * side;
          const ey = cy + Math.sin(angle) * radius * 0.35 + Math.sin(perp) * radius * 0.5 * side;
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(ex, ey, radius * 0.26, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#000000';
          ctx.beginPath();
          ctx.arc(ex + Math.cos(angle) * radius * 0.08, ey + Math.sin(angle) * radius * 0.08, radius * 0.12, 0, Math.PI * 2);
          ctx.fill();
        });
      }
    }

    drawParticles();
  }

  function shade(hex, percent) {
    const num = parseInt(hex.replace('#', ''), 16);
    let r = (num >> 16) + percent;
    let g = ((num >> 8) & 0x00ff) + percent;
    let b = (num & 0x0000ff) + percent;
    r = Math.min(255, Math.max(0, r));
    g = Math.min(255, Math.max(0, g));
    b = Math.min(255, Math.max(0, b));
    return `rgb(${r},${g},${b})`;
  }

  function update() {
    velocity = nextVelocity;
    const head = {
      x: snake[0].x + velocity.x,
      y: snake[0].y + velocity.y
    };

    if (
      head.x < 0 || head.x >= tileCount ||
      head.y < 0 || head.y >= tileCount ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      spawnSparkles(food.x, food.y, food.hex);
      score++;
      scoreEl.textContent = score;
      food = randomFood();
      speedMs = speedForScore(score);
    } else {
      snake.pop();
    }
  }

  function endGame() {
    gameOver = true;
    if (score > best) {
      best = score;
      localStorage.setItem('snakeBest', best);
      bestEl.textContent = best;
    }
    finalScoreEl.textContent = `Puntuación: ${score}`;
    overlay.classList.add('show');
    saveStatusEl.textContent = supabaseClient ? 'Guardando puntaje...' : '';
    saveScoreToRanking(playerName, score, rainbowMode ? 'rainbow' : snakeColorInput.value);
  }

  function loop() {
    if (gameOver) return;
    update();
    if (!gameOver) {
      loopHandle = setTimeout(loop, speedMs);
    }
  }

  function renderLoop() {
    updateParticles();
    draw();
    requestAnimationFrame(renderLoop);
  }

  const keyMap = {
    ArrowUp: { x: 0, y: -1 }, w: { x: 0, y: -1 }, W: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, s: { x: 0, y: 1 }, S: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, a: { x: -1, y: 0 }, A: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, d: { x: 1, y: 0 }, D: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    const dir = keyMap[e.key];
    if (!dir) return;
    e.preventDefault();
    if (dir.x === -velocity.x && dir.y === -velocity.y) return;
    nextVelocity = dir;
  });

  // swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = e.touches[0];
  });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    const dx = e.changedTouches[0].clientX - touchStart.clientX;
    const dy = e.changedTouches[0].clientY - touchStart.clientY;
    if (Math.abs(dx) > Math.abs(dy)) {
      nextVelocity = dx > 0 ? { x: 1, y: 0 } : { x: -1, y: 0 };
    } else {
      nextVelocity = dy > 0 ? { x: 0, y: 1 } : { x: 0, y: -1 };
    }
    touchStart = null;
  });

  restartBtn.addEventListener('click', resetGame);
  overlayRestart.addEventListener('click', resetGame);
  startBtn.addEventListener('click', startGame);

  resetGame();
  renderLoop();
})();
</script>
</body>
</html>
